<?xml version="1.0" encoding="UTF-8"?>
<!--
  LeiCraftMC logo — pixel-art mark + wordmark.
  Use in headers, splash screens, and documentation at a height of 32–64 px.
  Do not recolor the mark or change the wordmark font.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <!-- pixel-art block mark: 6×6 grid at 6 px per cell -->
  <g fill="#38bdf8">
    <rect x="0" y="6" width="6" height="6"/>
    <rect x="6" y="0" width="6" height="6"/>
    <rect x="12" y="6" width="6" height="6"/>
    <rect x="0" y="12" width="6" height="6"/>
    <rect x="6" y="12" width="6" height="6"/>
    <rect x="12" y="12" width="6" height="6"/>
    <rect x="18" y="12" width="6" height="6"/>
    <rect x="0" y="18" width="6" height="6"/>
    <rect x="12" y="18" width="6" height="6"/>
    <rect x="18" y="18" width="6" height="6"/>
    <rect x="24" y="18" width="6" height="6"/>
    <rect x="0" y="24" width="6" height="6"/>
    <rect x="6" y="24" width="6" height="6"/>
    <rect x="12" y="24" width="6" height="6"/>
    <rect x="24" y="24" width="6" height="6"/>
    <rect x="6" y="30" width="6" height="6"/>
    <rect x="18" y="30" width="6" height="6"/>
    <rect x="24" y="30" width="6" height="6"/>
    <rect x="12" y="36" width="6" height="6"/>
    <rect x="18" y="36" width="6" height="6"/>
  </g>
  <!-- wordmark -->
  <text x="44" y="32" font-family="Rubik, sans-serif" font-size="22" font-weight="600" fill="#f8fafc">
    LeiCraftMC
  </text>
</svg>
