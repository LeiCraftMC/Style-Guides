# Runs the registry image — CI (.gitlab/ci/build.yml) builds and pushes $CI_REGISTRY_IMAGE:latest
# from the default branch. Adjust the image name to your registry and project. Ports and DB paths
# are baked into the image (docker/Dockerfile ENV) — set only what differs for this deployment.
services:
  
  my-project:
    image: gcr.leicraftmc.de/leicraftmc/my-project:latest
    container_name: my-project
    restart: unless-stopped
    ports:
      - "12520:12520"
    environment:
      APPPREFIX_LOG_LEVEL: info

      APPPREFIX_API_DISABLE_DOCS: false

      APPPREFIX_APP_URL: http://localhost:12520

      APPPREFIX_SMTP_HOST: "mail.example.com"
      APPPREFIX_SMTP_PORT: 465
      APPPREFIX_SMTP_USERNAME: "YourSMTPUsernameHere"
      APPPREFIX_SMTP_PASSWORD: "YourSMTPPasswordHere"
      APPPREFIX_SMTP_FROM: '"App" <system@app.example.com>'
      APPPREFIX_SMTP_SECURE: true

    volumes:
      - ./data:/opt/leicraftmc/my-project/data
      - ./config:/opt/leicraftmc/my-project/config