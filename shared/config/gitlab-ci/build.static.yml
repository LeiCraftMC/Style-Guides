# .gitlab/ci/build.yml — build stage for static sites.
# Generates the site (`bun run generate` → .output/public/) and rsyncs it to the web host via
# .gitlab/ci/deploy.sh. Needs the CI variables DEPLOY_REMOTE_USER, DEPLOY_REMOTE_PASSWORD,
# DEPLOY_REMOTE_HOST and DEPLOY_REMOTE_DIR. Runs on the default branch only.

build_and_deploy_pages:

  stage: build

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always    # You can make it manual or automatic
      allow_failure: false
    - when: never

  before_script:

    - apt update && apt upgrade -y
    - apt install -y rsync sshpass openssh-client
    - bun install --frozen-lockfile

  script:
    - bun run generate

    - echo "Deploying to production & $CI_PAGES_URL"

    - bash .gitlab/ci/deploy.sh
