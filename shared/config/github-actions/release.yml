# .github/workflows/release.yml — GitHub Release workflow for CLI tools.
# Builds compiled binaries for all platforms and attaches them to a GitHub Release.
# Tag a version (e.g. v1.2.3) to trigger.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run compile all --no-version-tag
      - uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*
          generate_release_notes: true
